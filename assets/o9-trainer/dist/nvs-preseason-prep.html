<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVS Pre-Season Prep — Planning Trainer</title>
<style>
/* ============================================================
   PLANNING TRAINER DESIGN SYSTEM
   Platform layer = o9 workspace chrome.  Trainer layer = teaching.
   At most ONE warm surface per screen (ribbon OR coach).
   ============================================================ */
:root{
  /* Platform */
  --p-bg:#FFFFFF; --p-fill:#F0F0F0; --p-hair:#DEDEDE; --p-hair2:#CECECE;
  --p-text:#000000; --p-icon:#535353; --p-info:#1A73E8;
  /* Trainer ink ramp */
  --t-ink:#1A1A1A; --t-ink2:#5A5F66; --t-ink3:#8A8F96;
  --t-panel:#F7F7F8;
  /* Coach */
  --coach:#FF6A00; --eyebrow:#E05A00;
  /* Action families */
  --chase-ink:#1E7E34; --chase-fill:#EAF6EC;
  --cancel-ink:#B3261E; --cancel-fill:#FDECEA;
  --md-ink:#7A5F10;   --md-fill:#FFFBEA;
  --gm-ink:#6A3D8F;   --gm-fill:#F1E6F7;
  --imp-ink:#2F3B52;  --imp-fill:#EEF1F5;
  --none-ink:#8A8F96; --none-fill:#F7F7F8;
  --act-ink:#E07A1F;  --act-fill:#FDF0E2;
  /* Cell states */
  --c-edit:#FFFBEA; --c-calc:#FFFFFF; --c-lock:#F7F7F8;
  --c-constr:#FDECEA; --c-act:#FDF0E2;
  --edit-hover:#E6C200; --edit-focus:#1E2761;
  --ui:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  --num:Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--ui);font-size:12px;color:var(--p-text);background:var(--p-bg);overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--edit-focus);outline-offset:1px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hidden{display:none !important}

/* ---------- section header standard (SHARED-8) : left, uppercase, tracked, full width ---------- */
.sec-hdr{background:var(--p-fill);color:var(--p-text);font-size:10px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;text-align:left;padding:5px 8px;width:100%}
.sec-hdr.t{background:var(--t-panel);color:var(--t-ink2)}

/* ============================ APP SHELL ============================ */
#app{display:flex;flex-direction:column;height:100vh}
.appbar{display:flex;align-items:center;height:38px;border-bottom:1px solid var(--p-hair2);flex:0 0 auto;padding:0 6px}
.o9{width:22px;height:22px;background:#000;color:#fff;border-radius:3px;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:700;margin-right:8px}
.appbar .back{font-size:12px;margin-right:10px;color:var(--p-text)}
.appbar .pagechip{border:1px solid var(--p-hair2);padding:5px 16px;font-size:12px}
.appbar .spacer{flex:1}
.appbar .icons{display:flex;gap:2px;color:var(--p-icon)}
.appbar .icons span{width:24px;text-align:center;font-size:13px}
.appbar .who{font-size:10px;color:var(--p-icon);margin:0 8px}
.avatar{width:22px;height:22px;background:#3A3A3A;color:#fff;border-radius:2px;display:flex;
  align-items:center;justify-content:center;font-size:9px}

.main{display:flex;flex:1;min-height:0}
.railL{width:34px;background:var(--p-fill);display:flex;flex-direction:column;align-items:center;
  padding-top:10px;gap:12px;color:var(--p-icon);font-size:14px;flex:0 0 auto}
.railR{width:34px;background:var(--p-bg);border-left:1px solid var(--p-hair);display:flex;
  flex-direction:column;align-items:center;padding-top:12px;gap:12px;color:var(--p-icon);font-size:13px;flex:0 0 auto}

/* ---------- Pages nav ---------- */
.pages{width:203px;border-right:1px solid var(--p-hair);overflow-y:auto;flex:0 0 auto;background:var(--p-bg)}
.pages h2{font-size:13px;font-weight:700;margin:0;padding:10px 12px 8px}
.navrow{height:43px;display:flex;align-items:center;padding:0 12px;font-size:12px;position:relative;
  border:0;background:none;width:100%;text-align:left;color:var(--p-text)}
.navrow.grp{font-weight:700;justify-content:space-between}
.navrow.leaf{padding-left:22px}
.navrow.nav-on{cursor:pointer}
.navrow.nav-off{cursor:default;color:var(--p-text)}
.navrow.active{background:var(--p-fill)}
.navrow.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#000}
.navrow .chev{color:var(--p-icon);font-size:10px}

/* ---------- content ---------- */
.content{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.scopebar{display:flex;align-items:center;gap:10px;height:32px;border-bottom:1px solid var(--p-hair);
  padding:0 8px;flex:0 0 auto;overflow-x:auto;white-space:nowrap}
.scopebar .ic{color:var(--p-icon);font-size:13px}
.scope{display:flex;align-items:center;gap:5px}
.scope .k{font-size:10px;color:var(--p-icon)}
.scope .v{font-size:10px;background:var(--p-fill);padding:3px 8px}
.rpthdr{display:flex;align-items:baseline;gap:14px;padding:8px 10px 0;flex:0 0 auto}
.rpthdr h1{font-size:13.5px;font-weight:700;margin:0;border-bottom:2px solid #000;padding-bottom:3px}
.rows{font-size:10px;color:var(--p-info)}
.toolbar{margin-left:auto;display:flex;gap:14px;align-items:center}
.tool{border:0;background:none;font-size:10.5px;color:var(--p-text);padding:2px 0}
.tool.primary{border:1px solid var(--p-hair2);padding:4px 10px}
.tool[disabled]{color:var(--t-ink3);background:var(--none-fill);border:1px solid #E2E2E2;cursor:not-allowed}

.tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--p-hair);flex:0 0 auto}
.tab{border:0;background:none;padding:6px 14px 8px;font-size:12px;color:var(--p-icon);position:relative}
.tab.on{color:var(--p-text);font-weight:700}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#000}
.tab[disabled]{cursor:default}
.subtabs{display:flex;gap:4px;padding:6px 10px 0;border-bottom:1px solid var(--p-hair);flex:0 0 auto}

.workarea{flex:1;display:flex;min-height:0}
.gridwrap{flex:1;overflow:auto;padding:10px}
.notice{padding:7px 10px;font-size:11px;margin-bottom:8px}
.notice.ro{background:var(--none-fill);color:var(--t-ink2);font-weight:700}
.notice.gap{background:var(--md-fill);color:var(--md-ink);font-weight:700}
.notice.warn{background:var(--cancel-fill);color:var(--cancel-ink)}
.notice.info{background:var(--gm-fill);color:var(--gm-ink)}

/* ---------- ribbon (warm surface — only when coach is collapsed) ---------- */
.ribbon{display:flex;align-items:stretch;background:var(--act-fill);flex:0 0 auto}
.ribbon .mlabel{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--act-ink);
  display:flex;align-items:center;padding:0 12px;white-space:nowrap}
.rstep{padding:5px 10px;min-width:150px}
.rstep .t{font-size:10.5px;color:var(--t-ink3)}
.rstep .s{font-size:9px;font-style:italic;color:var(--t-ink3)}
.rstep.on{background:#fff;border:1px solid var(--act-ink)}
.rstep.on .t{color:var(--t-ink);font-weight:700}
.rstep.on .s{color:var(--act-ink)}
.rsep{display:flex;align-items:center;color:var(--t-ink3);padding:0 2px}

/* ---------- grid ---------- */
table.g{border-collapse:collapse;font-size:11px;width:100%}
table.g th,table.g td{border-right:1px solid var(--p-hair);border-bottom:1px solid var(--p-hair2);
  padding:4px 6px;white-space:nowrap;vertical-align:middle}
table.g thead th{border-bottom:2px solid var(--p-hair2);font-size:10.5px;font-weight:700;text-align:left;background:#fff;
  position:sticky;top:0;z-index:2}
table.g th[scope="row"]{font-weight:400;text-align:left}
td.n,th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
tr.grouprow td{background:var(--p-fill);font-size:10px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;border-right:0}
tr.grouprow.act td{background:var(--act-fill);color:var(--act-ink)}
tr.grouprow.none td{background:var(--none-fill);color:var(--none-ink)}
td.calc{background:var(--c-calc)}
td.edit{background:var(--c-edit);cursor:text}
td.edit:hover{outline:2px solid var(--edit-hover);outline-offset:-2px}
td.lockcell{background:var(--c-lock);color:var(--t-ink3);font-style:italic}
td.constr{background:var(--c-constr);color:var(--cancel-ink);font-weight:700}
td.actual{background:var(--c-act);color:var(--act-ink)}
td.mute{color:var(--t-ink3)}
td.ital{font-style:italic;color:var(--t-ink3)}
td.expl{cursor:pointer}
td.expl:hover{text-decoration:underline}
input.cell{width:100%;border:2px solid var(--edit-focus);background:#fff;font-family:var(--num);
  font-size:11px;text-align:right;padding:2px 4px}
input.cell[type=date]{font-family:var(--ui);font-size:10px}
.flagtxt{font-size:8.5px;font-weight:700;letter-spacing:.3px;display:block}
.pill{display:inline-block;border-radius:9px;padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:.4px}
.lockbtn{border:1px solid var(--p-hair2);background:#fff;font-size:9px;font-weight:700;padding:2px 6px;letter-spacing:.3px}
.lockbtn.on{background:var(--p-fill);color:var(--t-ink2)}
.finmark{font-size:8.5px;color:var(--t-ink3);letter-spacing:.3px}

/* ============================ TRAINER LAYER ============================ */
.overlay{position:fixed;inset:0;background:rgba(26,26,26,.62);z-index:60;display:flex;
  align-items:center;justify-content:center}
.modal{background:#fff;max-width:560px;width:92%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal .bar{height:5px;background:var(--coach)}
.modal .body{padding:20px 24px}
.modal .eyebrow{font-size:10px;font-weight:700;letter-spacing:.9px;color:var(--eyebrow)}
.modal h3{font-size:19px;margin:8px 0 10px}
.modal p{font-size:12.5px;color:var(--t-ink2);line-height:1.55;margin:0 0 10px}
.modal .foot{display:flex;align-items:center;gap:8px;margin-top:16px}
.dots{display:flex;gap:6px;flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:#D8D8D8}
.dot.on{background:var(--coach)}
.btn{border:1px solid var(--p-hair2);background:#fff;padding:6px 14px;font-size:11.5px;color:var(--t-ink2)}
.btn.pri{background:var(--coach);border-color:var(--coach);color:#fff;font-weight:700}
.btn.dark{background:var(--t-ink);border-color:var(--t-ink);color:#fff;font-weight:700}
.btn.ghost{background:none;border:0;color:var(--t-ink3);font-size:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Coach dock */
#coach{position:fixed;right:46px;bottom:18px;z-index:50;width:300px;background:#fff;
  border:1.5px solid var(--coach);border-radius:5px;box-shadow:0 4px 14px rgba(0,0,0,.16);
  transition:width .3s ease}
#coach.exp{width:430px}
.coachhead{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer}
.cavatar{width:24px;height:24px;border-radius:50%;background:var(--coach);color:#fff;font-weight:700;
  font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.coachhead .eb{font-size:9.5px;font-weight:700;letter-spacing:.8px;color:var(--eyebrow)}
.coachhead .sub{font-size:10px;color:var(--t-ink2)}
.coachhead .chev{margin-left:auto;color:var(--t-ink3)}
.coachbody{padding:0 12px 12px 43px;font-size:11.5px;color:var(--t-ink);line-height:1.5}
.coachfoot{border-top:1px solid #EDEDED;margin-top:9px;padding-top:7px;font-size:10px;
  font-style:italic;color:var(--t-ink3)}

/* Side panels — animate width, never overlay */
.side{flex:0 0 auto;width:0;overflow:hidden;border-left:1px solid var(--p-hair);
  transition:width .3s ease;background:#fff;display:flex;flex-direction:column}
.side.open{width:400px}
.side.inbox.open{width:340px}
.side .bar{height:5px;background:var(--coach);flex:0 0 auto}
.side .hd{padding:11px 14px 8px;flex:0 0 auto;position:relative}
.side .hd .eyebrow{font-size:10px;font-weight:700;letter-spacing:.9px;color:var(--eyebrow)}
.side .hd h3{font-size:15px;margin:6px 0 2px}
.side .hd .meta{font-size:10.5px;color:var(--t-ink3)}
.side .x{position:absolute;right:8px;top:8px;border:0;background:none;font-size:16px;color:var(--t-ink3)}
.side .sc{overflow-y:auto;padding:0 0 16px;flex:1}
.calcrow{display:flex;justify-content:space-between;padding:5px 14px;font-size:11px}
.calcrow b{font-family:var(--num);font-size:12px}
.calcrow.mute,.calcrow.mute b{color:var(--t-ink3)}
.rulebox{margin:8px 14px;padding:10px;font-size:11px;line-height:1.6}
.rulebox.constr{background:var(--c-constr);color:var(--cancel-ink)}
.conseq{padding:10px 14px;font-size:11.5px;font-weight:700;line-height:1.5}
.side ul{margin:8px 0;padding-left:30px;font-size:11px;color:var(--t-ink2);line-height:1.7}
.panelfoot{margin:10px 14px;padding:9px;background:var(--none-fill);font-size:10px;
  font-style:italic;color:var(--t-ink3);line-height:1.5}

/* Inbox cards */
.summary{margin:8px 14px;padding:6px 10px;background:var(--imp-fill);color:var(--imp-ink);
  font-size:10.5px;font-weight:700}
.card{margin:0 14px 8px;border:1px solid var(--p-hair);border-left-width:4px;padding:9px 10px}
.card.done{opacity:.55;border-left-color:var(--p-hair)!important}
.card h4{font-size:11.5px;margin:6px 0 4px}
.card p{font-size:10.5px;color:var(--t-ink3);margin:0 0 8px;line-height:1.45}
.card .acts{display:flex;flex-wrap:wrap;gap:6px}
.card .acts button{border:1px solid var(--p-hair2);background:#fff;font-size:10px;padding:4px 9px}
.card .fb{margin-top:8px;padding:8px;font-size:10.5px;line-height:1.5}

/* Cascade tiers */
.tier{display:flex;align-items:stretch;margin:0 14px 8px;border:1px solid #E8E8E8;background:#FCFCFC}
.tier.win{border-width:1.5px;background:#fff}
.tier .badge{width:44px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.tier .mid{padding:8px 10px;flex:1}
.tier .mid .lab{font-size:11px}
.tier .mid .val{font-family:var(--num);font-size:14px;font-weight:700}
.tier .st{display:flex;align-items:center;padding-right:10px}

/* Flow nodes */
.flow{display:flex;gap:6px;padding:0 14px;flex-wrap:wrap}
.node{border:1.25px solid;flex:1;min-width:120px}
.node .cap{font-size:8.5px;font-weight:700;letter-spacing:.7px;padding:3px 7px}
.node .nm{font-size:11px;font-weight:700;padding:5px 7px 0;color:var(--t-ink)}
.node .vl{font-family:var(--num);font-size:15px;font-weight:700;padding:0 7px}
.node .sb{font-size:9.5px;font-style:italic;color:var(--t-ink3);padding:0 7px 6px}

/* ============================ FULL-SCREEN TRAINER SCREENS ============================ */
.screen{position:fixed;inset:0;background:#fff;z-index:70;overflow-y:auto}
.dark{background:var(--t-ink);color:#fff}
.launch{display:grid;grid-template-columns:38% 1fr;min-height:100vh}
.launch .l{background:var(--t-ink);color:#fff;padding:52px 44px}
.launch .r{padding:52px 44px}
.kicker{width:44px;height:4px;background:var(--coach);margin-bottom:18px}
.launch h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1.15;margin:0 0 22px}
.launch .lede{font-size:13px;color:#C9CDD2;line-height:1.6;max-width:330px}
.fact{margin-top:26px}
.fact .k{font-size:9.5px;font-weight:700;letter-spacing:.9px;color:var(--t-ink3)}
.fact .v{font-size:12.5px;margin-top:3px}
.brief p{font-size:13px;color:var(--t-ink);line-height:1.65;margin:0 0 12px;max-width:720px}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px;max-width:720px}
.path{border:1px solid var(--p-hair);box-shadow:0 2px 6px rgba(0,0,0,.06);padding:0 0 18px}
.path .top{height:5px}
.path h3{font-size:15px;letter-spacing:.6px;margin:16px 18px 8px}
.path .q{font-size:11.5px;font-style:italic;color:var(--t-ink2);margin:0 18px 10px;line-height:1.5}
.path .m{font-size:10px;color:var(--t-ink3);margin:0 18px 14px}
.path button{margin:0 18px}
.arc{display:flex;gap:10px;margin-top:22px;max-width:720px}
.arc div{flex:1;padding:9px 11px;font-size:10.5px;background:var(--none-fill);color:var(--t-ink3)}
.arc div.on{background:var(--act-fill);color:var(--act-ink);font-weight:700}

.wrapc{max-width:1180px;margin:0 auto;padding:40px 44px 60px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.check{border:1px solid var(--p-hair);border-left-width:6px;padding:14px 18px}
.check .hd{display:flex;align-items:center;gap:12px}
.check h3{font-size:14px;letter-spacing:.4px;margin:0;flex:1}
.check .desc{font-size:11.5px;font-style:italic;color:var(--t-ink2);margin:6px 0 8px}
.check ul{margin:8px 0 0;padding-left:20px;font-size:11px;color:var(--t-ink2);line-height:1.75}
.kpi{border:1px solid var(--p-hair);border-left-width:6px;padding:12px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:18px}
.kpi .l{flex:1}
.kpi .id{font-size:9.5px;font-weight:700;letter-spacing:.7px;color:var(--t-ink3)}
.kpi h3{font-size:15px;margin:3px 0 5px}
.kpi .d{font-size:10.5px;color:var(--t-ink2);line-height:1.45}
.kpi .r{width:230px;text-align:right}
.bar{height:9px;background:#EFEFEF;position:relative;margin-bottom:5px}
.bar i{position:absolute;left:0;top:0;bottom:0}
.kpi .pc{font-family:var(--num);font-size:20px;font-weight:700}
.kpi .mm{font-family:var(--num);font-size:9.5px;color:var(--t-ink3)}
.ledger{border:1px solid var(--p-hair);border-left-width:5px;padding:8px 12px;margin-bottom:6px;
  display:flex;gap:14px;font-size:10.5px;align-items:center}
.ledger .id{font-weight:700;color:var(--t-ink3);width:52px}
.ledger .w{flex:1}
.ledger .o{font-weight:700;width:250px;text-align:right}
.mascot{max-width:250px;display:block;margin:22px auto 0}
.tierbadge{background:var(--coach);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.5px;
  padding:9px;text-align:center;margin-top:16px}
.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:34px 0}
.principle{background:#232323;padding:0 0 22px}
.principle .top{height:5px;background:var(--coach)}
.principle .n{font-family:var(--num);font-size:22px;font-weight:700;color:var(--coach);margin:18px 22px 6px}
.principle h3{font-size:15px;color:#fff;margin:0 22px 10px;line-height:1.35}
.principle p{font-size:11.5px;color:var(--t-ink3);margin:0 22px;line-height:1.6}
.bignum{font-family:var(--num);font-size:76px;font-weight:700;line-height:1}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.evrow{border:1px solid var(--p-hair);border-left-width:5px;padding:9px 12px;margin-bottom:8px}
.evrow .t{font-size:11.5px;font-weight:700}
.evrow .s{font-size:10px;color:var(--t-ink3);font-style:italic;margin-top:2px}
.rationale{width:100%;font-family:var(--ui);font-size:11px;padding:6px;border:1px solid var(--p-hair2);
  margin-top:6px;min-height:44px}

</style>
</head>
<body>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="app" class="hidden"></div>
<script>
/*
 * O9 TRAINER ENGINE — shared chrome + generic mechanics for every trainer.
 *
 * Loaded as a plain script before a trainer's content.js, so both share one
 * global scope (same pattern the original monolithic file used internally —
 * this split only moves code between files, it does not change how it runs).
 *
 * What lives here: formatters, small render helpers with zero domain logic,
 * the Coach dock, the Guided Tour, the full-screen "screen" shell helpers,
 * and the scoring/tier aggregation. Everything domain-specific — nav
 * structure, seed data, formulas, grids, side-panel content, screen copy,
 * exceptions, hints, tour steps, KPI definitions, month-rollover rules —
 * lives in each trainer's own content.js and is expected to define these
 * globals before the engine's tour/coach/scoring functions are called:
 *   S            — the mutable trainer state (content creates/owns it)
 *   HINTS        — { [id]: { b, f } } coach hint copy, keyed by id
 *   TOUR_STEPS   — [{ t, b }] guided tour steps
 *   KPI_OPTIONS  — [{ id, name, desc, fn() }] scoring functions

function renderTour(){

	if(!S.tourOpen) return;

	const ov = document.createElement("div");
	ov.id = "tourOv"; ov.className = "overlay"; ov.setAttribute("role","dialog");
	ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-label","Guided Tour step "+(S.tourIdx+1)+" of "+TOUR_STEPS.length);

/* ==================================================================
   SCORING — generic given content-supplied KPI_OPTIONS / KPI_WEIGHTS / TIER_BANDS.
   ================================================================== */
function computeScore(){
	const vals = {}; let tot = 0, wt = 0;
	KPI_OPTIONS.forEach((k,i)=>{
		const v = Math.max(0, Math.min(100, k.fn()));
		vals[k.id] = v;
		const w = KPI_WEIGHTS["kpi"+(i+1)];
		tot += v*w; wt += w;
	});
	return { vals, readiness: wt ? tot/wt : 0 };
}
function getScoreBadgeTier(readiness){
	return TIER_BANDS.find(b=>readiness >= b.min) || TIER_BANDS[TIER_BANDS.length-1];
}
/* Is this the best tier a trainer can award? Every trainer's TIER_BANDS is
   written highest-threshold-first (see nvs-reforecast / nvs-preseason-prep),
   so the top tier is simply the first entry. */
function isTopTier(tier){ return tier === TIER_BANDS[0]; }

/* ==================================================================

   trainer owns its own celebration: content.js defines its own
   TIER_MEDIA map with paths relative to its own trainer folder (e.g.
   "tier-media/tier-1.png", stored alongside that trainer's content.js),
   and calls this renderer with the resolved path. This function is pure
   engine plumbing — no trainer-specific data lives here — so two
   trainers can show completely different Tier 1 celebrations.
   tools/bundle-trainer.js inlines a trainer's own tier-media files as
   base64 when it builds that trainer's standalone .html.
   ================================================================== */
function tierMediaHTML(src, tier){
	if(!src) return "";
	const isVideo = /\.(mp4|webm|mov)(\?|$)/i.test(src);
	return isVideo
		? `<video class="mascot" src="${src}" autoplay loop muted playsinline></video>`
		: `<img class="mascot" alt="Tier ${tier} celebration" src="${src}">`;
}

	{ id:"KPI-1", name:"Flag Accuracy",
	  desc:"Share of style colors needing a Rebuy/Closeout confirmation that ended with the correct flag set.",
	  fn:function(){
	  	const needFlag = S.styles.filter(styleEligibleForFlag);
	  	if(!needFlag.length) return 100;
	  	const correct = needFlag.filter(r=> r.flag === (r.sellDown ? "closeout" : "rebuy"));
	  	return 100 * correct.length / needFlag.length;
	  } },
	{ id:"KPI-2", name:"Error Handling Discipline",
	  desc:"Share of Assortment Management Errors exported to the owning partner rather than left open.",
	  fn:function(){
	  	const errs = S.styles.filter(r=>r.hasError);
	  	if(!errs.length) return 100;
	  	return 100 * errs.filter(r=>r.errorExported).length / errs.length;
	  } },
	{ id:"KPI-3", name:"Placeholder Readiness",
	  desc:"Share of Closeout Placeholders with Net Sales, AUR, AUC and Transfer In all populated.",
	  fn:function(){
	  	if(!S.placeholders.length) return 100;
	  	return 100 * S.placeholders.filter(placeholderPopulated).length / S.placeholders.length;
	  } },
	{ id:"KPI-4", name:"Guardrail Discipline",
	  desc:"Correct routing of every live exception-inbox item — escalate when it's someone else's fix, dismiss when it isn't.",
	  fn:function(){
	  	const items = S.inbox.filter(i=>i.resolved);
	  	if(!items.length) return 100;
	  	return 100 * items.filter(i=>i.chosen===i.correctAction).length / items.length;
	  } }
];

/* ==================================================================
   STATE
   ================================================================== */
let S = null;
function newRun(mode){
	S = {
		mode, cycle:1, tourComplete:false, tourIdx:0, tourOpen:false,
		page:"assortment", tab:"grid",
		styles: clone(STYLE_SEED), inactive: clone(INACTIVE_BOP_SEED),
		placeholders: clone(PLACEHOLDER_SEED), presmins: clone(PRESMIN_SEED),
		inbox: clone(NVS_PREP_EXCEPTIONS[1]),
		firedHints:{}, coachExpanded:false, coachHint:null,
		side:null, sideCtx:null, cycleScores:[], ledger:[], screen:null
	};
	S.styles.forEach(r=>{ if(r.flag===undefined) r.flag=null; r.errorExported=false; r.deleteAccepted=false; });
	S.inactive.forEach(r=>{ r.aurDegOverride=null; r.analyticFcstOverride=null; r.locked=false; });
	S.placeholders.forEach(p=>{ p.fcstOvrd=null; p.aur=null; p.auc=null; p.transferIn=null; });
	S.presmins.forEach(p=>{ p.override=null; });
	return S;
}

/* fireHint() / skipTour() live here — see engine's comment on why. */
function fireHint(id, opts){
	opts = opts || {};
	if(!HINTS[id]) return;
	if(S.cycle===2 && S.firedHints[id] && !opts.force) return;
	S.firedHints[id] = true;
	S.coachHint = id;
	const auto = (S.mode==="guided" && !opts.postCommitOnly) || (S.mode==="challenge" && opts.postCommit);
	if(auto) S.coachExpanded = true;
	announce("Coach note " + id);
}
function skipTour(){
	S.tourOpen = false; S.tourComplete = true;
	const ov = document.getElementById("tourOv"); if(ov) ov.remove();
	fireHint("H-1");
	render();
}

/* ==================================================================
   SHELL RENDER
   ================================================================== */
function render(){
	const app = document.getElementById("app");
	app.className = "";
	app.innerHTML =
		appbarHTML() +
		'<div class="main">' + railLHTML() + pagesHTML() +
		  '<div class="content">' + scopeHTML() + reportHeaderHTML() + tabsHTML() +
		    '<div class="workarea"><div class="gridwrap" id="gw">' + bodyHTML() + '</div>' +
		    sidePanelHTML() + '</div>' +
		  '</div>' + railRHTML() +
		'</div>';
	renderCoach();
	bindShell();
}
function appbarHTML(){
	const ic = ["⌕","☁","☷","▤","○","△","↻","⚙"].map(i=>`<span>${i}</span>`).join("");
	return `<div class="appbar"><div class="o9">o9</div><div class="back">←&nbsp; AP NVS</div>
    <div class="pagechip">${esc(PAGE_CHIP[S.page])}</div><div class="spacer"></div>
    <div class="icons">${ic}</div><div class="who">APNVS</div><div class="avatar">JH</div></div>`;
}
function railLHTML(){ return `<div class="railL" aria-hidden="true"><span>≡</span><span>▦</span><span>▭</span><span>☺</span></div>`; }
function railRHTML(){ return `<div class="railR" aria-hidden="true"><span>▤</span><span>⚙</span><span>◉</span><span>?</span></div>`; }
function pagesHTML(){
	let h = `<nav class="pages" aria-label="Pages"><h2>Pages</h2>`;
	NAV.forEach((n,i)=>{
		if(n.grp) h += `<div class="navrow grp nav-off">${esc(n.l)}<span class="chev">˄</span></div>`;
		else {
			const active = n.page === S.page;
			h += `<button class="navrow leaf nav-on ${active?"active":""}" data-nav="${i}">${esc(n.l)}</button>`;
		}
	});
	return h + `</nav>`;
}
function scopeHTML(){
	return `<div class="scopebar"><span class="ic">▥</span><span class="ic">∇</span>` +
	  SCOPE.map(([k,v])=>`<span class="scope"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></span>`).join("") +
	  `<span style="margin-left:auto;color:var(--p-icon);font-size:11px">☆&nbsp;&nbsp;↪&nbsp;&nbsp;⋮</span></div>`;
}
function reportHeaderHTML(){
	const rows = { "assortment": S.tab==="error" ? "Showing "+S.styles.filter(r=>r.hasError).length+" rows of data."
	                 : "Showing "+S.styles.length+" rows of data.",
	               "seasonal-attrs":"Showing 1,207 rows of data.", "inactive":"Showing "+S.inactive.length+" rows of data.",
	               "presmin":"Showing "+S.presmins.length+" rows of data.", "closeout":"Showing "+S.placeholders.length+" rows of data." }[S.page];
	let tools = "";
	if(S.page==="assortment" && S.tab==="grid")
		tools = `<button class="tool primary" id="btnAcceptDeletes">Accept Line Delete Updates</button>`;
	if(S.page==="assortment" && S.tab==="error")
		tools = `<button class="tool primary" id="btnExportErrors">Export to Merch</button>`;
	const std = ["Export Pivot ˅","Download ˅","Bulk Edit ˅","Filters ˅","Layout","Local Edit"]
	  .map(t=>`<button class="tool">${esc(t)}</button>`).join("");
	return `<div class="rpthdr"><h1>${esc(PAGE_TITLE[S.page]())}</h1><span class="rows">ⓘ ${esc(rows)}</span>
    <div class="toolbar">${tools}${std}</div></div>`;
}
function tabsHTML(){
	if(S.page!=="assortment") return ribbonHTML();
	return ribbonHTML() + `<div class="subtabs">
    <button class="tab ${S.tab==="grid"?"on":""}" data-tab="grid">Assortment Management</button>
    <button class="tab ${S.tab==="error"?"on":""}" data-tab="error">Assortment Management Error</button></div>`;
}
function ribbonHTML(){
	let h = `<div class="ribbon" ${S.coachExpanded?'style="background:var(--none-fill)"':""}>
    <div class="mlabel">${esc(CYCLE_CFG[S.cycle].label)}</div>`;
	RIBBON_STEPS.forEach((s,i)=>{
		h += `<div class="rstep ${i===1?"on":""}"><div class="t">${esc(s[0])}</div><div class="s">${esc(s[1])}</div></div>`;
		if(i<RIBBON_STEPS.length-1) h += `<div class="rsep">›</div>`;
	});
	return h + `<div style="flex:1"></div></div>`;
}

/* ==================================================================
   GRID DISPATCHER
   ================================================================== */
function bodyHTML(){
	if(S.page==="assortment")     return S.tab==="error" ? gridError() : gridAssortment();
	if(S.page==="seasonal-attrs") return gridSeasonalAttrs();
	if(S.page==="inactive")       return gridInactive();
	if(S.page==="presmin")        return gridPresMin();
	if(S.page==="closeout")       return gridCloseout();
}

/* ---------- Assortment Management ---------- */
function gridAssortment(){
	let h = `<table class="g"><thead><tr><th>Actions</th><th>MidLevel</th><th>Style</th><th>Style Color</th>
    <th class="n">Allocated U…</th><th>Delete Indicator</th><th>Flag</th></tr></thead><tbody>`;
	S.styles.forEach(r=>{
		let actionCell;
		if(r.deleteIndicator && !r.deleteAccepted){
			actionCell = `<button class="lockbtn" data-accept-delete="${r.id}">Accept Delete</button>`;
		} else if(r.hasError && r.errorExported){
			actionCell = `<span class="finmark">exported — pending Merch correction</span>`;
		} else if(styleBlocked(r)){
			actionCell = `<span class="finmark">blocked — export error first</span>`;
		} else if(!r.flag){
			actionCell = `<button class="lockbtn" data-flag="${r.id}|rebuy">Confirm Rebuy</button>
        <button class="lockbtn" data-flag="${r.id}|closeout">Confirm Closeout</button>`;
		} else {
			actionCell = `<span class="pill" style="color:var(--${r.flag==="rebuy"?"chase-ink":"gm-ink"});background:var(--${r.flag==="rebuy"?"chase-fill":"gm-fill"})">${r.flag.toUpperCase()} CONFIRMED</span>`;
		}
		h += `<tr><td>${actionCell}</td><td>${esc(r.midlevel)}</td><td>${esc(r.style)}</td><td>${esc(r.styleColor)}</td>
      <td class="n ${r.allocatedUnits==null?"mute":""}">${r.allocatedUnits==null?"—":fU(r.allocatedUnits)}</td>
      <td class="n ${r.deleteIndicator?"constr":""}">${r.deleteIndicator}${r.deleteAccepted?" ✓":""}</td>
      <td>${r.flag ? esc(r.flag) : (r.hasError?`<span class="mute">${esc(r.errorType)}${r.errorExported?" (exported)":""}</span>`:"—")}</td></tr>`;
	});
	return h + `</tbody></table>
    <p style="font-size:10.5px;font-style:italic;color:var(--t-ink3);margin:8px 2px 18px">
    This is not where sales get planned — this is where the inputs to the plan get made clean.</p>`;
}
function gridError(){
	const errs = S.styles.filter(r=>r.hasError);
	let h = `<div class="notice warn"><b style="display:block;font-size:9.5px;letter-spacing:.7px;margin-bottom:5px">GUARDRAILS</b>
    Cannot plan or override products in this tab. Errors cannot be fixed inside o9.</div>
    <table class="g"><thead><tr><th>Style Color</th><th>MidLevel</th><th>Error</th><th>Status</th></tr></thead><tbody>`;
	errs.forEach(r=>{
		h += `<tr><td>${esc(r.styleColor)}</td><td>${esc(r.midlevel)}</td><td>${esc(r.errorType)}</td>
      <td>${r.errorExported ? '<span class="pill" style="color:var(--chase-ink);background:var(--chase-fill)">EXPORTED</span>' : '<span class="pill" style="color:var(--cancel-ink);background:var(--cancel-fill)">OPEN</span>'}</td></tr>`;
	});
	if(!errs.length) h += `<tr><td colspan="4" class="mute">No open errors.</td></tr>`;
	return h + `</tbody></table>`;
}

/* ==================================================================
   SIDE PANEL — inbox only for this trainer.
   ================================================================== */
function sidePanelHTML(){
	if(S.side==="inbox") return `<aside class="side inbox open" role="complementary">${inboxHTML()}</aside>`;
	return `<aside class="side"></aside>`;
}
function inboxHTML(){
	const items = S.inbox;
	const live = items.filter(i=>!i.decoy && !i.resolved).length;
	const dec  = items.filter(i=>i.decoy && !i.resolved).length;
	const inkOf = k => ({cancel:["cancel-ink","cancel-fill"],md:["md-ink","md-fill"],chase:["chase-ink","chase-fill"],
	                     gm:["gm-ink","gm-fill"],none:["none-ink","none-fill"]})[k];
	let h = panelHead("EXCEPTION INBOX","", CYCLE_CFG[S.cycle].label+"  ·  "+items.length+" items");
	h += `<div class="sc"><div class="summary">${live} need a decision &nbsp;·&nbsp; ${dec} need nothing</div>`;
	items.forEach(it=>{
		const [i1,f1c] = inkOf(it.kind);
		h += `<div class="card ${it.resolved?"done":""}" style="border-left-color:var(--${i1})">
      <span class="pill" style="color:var(--${i1});background:var(--${f1c})">${esc(it.type)}</span>
      <h4>${esc(it.title)}</h4><p>${esc(it.body)}</p>`;
		if(!it.resolved){
			h += `<div class="acts">` + it.options.map(o=>
			  `<button data-inbox="${it.id}|${o.a}" style="color:var(--${i1})">${esc(o.l)} ›</button>`).join("") + `</div>`;
		} else if(it.shownFeedback){
			const good = it.chosen === it.correctAction;
			h += `<div class="fb" style="background:var(--${good?"chase-fill":"cancel-fill"});color:var(--${good?"chase-ink":"cancel-ink"})">
        ${esc(it.shownFeedback)}</div>`;
		}
		h += `</div>`;
	});
	return h + `</div>`;
}

/* ==================================================================
   INTERACTION
   ================================================================== */
function findStyle(id){ return S.styles.find(r=>r.id===id); }
function bindShell(){
	const app = document.getElementById("app");

	app.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{
		const n = NAV[Number(b.dataset.nav)];
		if(!n.page) return;
		S.page = n.page; S.side = null; if(n.page==="assortment") S.tab="grid";
		render();
	}));
	app.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
		S.tab = b.dataset.tab; S.side = null;
		if(S.tab==="error") fireHint("H-2");
		render();
	}));

	const bAccept = app.querySelector("#btnAcceptDeletes");
	if(bAccept) bAccept.addEventListener("click", ()=>{
		S.styles.forEach(r=>{ if(r.deleteIndicator) r.deleteAccepted = true; });
		announce("Line Delete Updates accepted."); render();
	});
	const bExport = app.querySelector("#btnExportErrors");
	if(bExport) bExport.addEventListener("click", ()=>{
		S.styles.forEach(r=>{ if(r.hasError) r.errorExported = true; });
		announce("Errors exported to Merch."); render();
	});

	app.querySelectorAll("[data-accept-delete]").forEach(b=>b.addEventListener("click",()=>{
		const r = findStyle(b.dataset.acceptDelete); r.deleteAccepted = true;
		announce("Line Delete accepted for "+r.styleColor+"."); render();
	}));
	app.querySelectorAll("[data-flag]").forEach(b=>b.addEventListener("click",()=>{
		const [id,flag] = b.dataset.flag.split("|");
		const r = findStyle(id); r.flag = flag;
		fireHint("H-1");
		announce(r.styleColor+" flagged "+flag+"."); render();
	}));

	app.querySelectorAll("[data-lock-inactive]").forEach(b=>b.addEventListener("click",()=>{
		const r = S.inactive.find(x=>x.id===b.dataset.lockInactive);
		r.locked = !r.locked; fireHint("H-5");
		announce(r.locked?"Row locked.":"Row unlocked."); render();
	}));

	app.querySelectorAll("[data-edit]").forEach(td=>{
		td.addEventListener("click", ()=>beginEdit(td));
	});
	app.querySelectorAll("[data-inbox]").forEach(b=>b.addEventListener("click",()=>{
		const [id,act] = b.dataset.inbox.split("|");
		resolveException(id, act);
	}));
	app.querySelectorAll("[data-close-side]").forEach(b=>b.addEventListener("click",()=>{ S.side=null; render(); }));

	renderTour();
}

function findEditable(id){
	return S.inactive.find(x=>x.id===id) || S.placeholders.find(x=>x.id===id) || S.presmins.find(x=>x.id===id);
}
function beginEdit(td){
	const [id,field,m] = td.dataset.edit.split("|");
	const row = findEditable(id);
	const cur = row[field];
	const inp = document.createElement("input");
	inp.className="cell"; inp.type="number"; inp.step="any";
	inp.value = cur==null ? "" : cur;
	td.textContent=""; td.appendChild(inp); inp.focus(); inp.select();
	const commit = ()=>{
		const raw = inp.value.trim();
		const val = raw==="" ? null : Number(raw);
		if(raw!=="" && isNaN(val)) { render(); return; }
		row[field] = val;
		if(S.placeholders.includes(row) && val != null) fireHint("H-3");
		if(S.presmins.includes(row) && val != null) fireHint("H-4");
		render();
	};
	inp.addEventListener("blur", commit);
	inp.addEventListener("keydown", e=>{
		if(e.key==="Enter"){ e.preventDefault(); commit(); }
		if(e.key==="Escape"){ e.preventDefault(); render(); }
	});
}

function resolveException(id, action){
	const it = S.inbox.find(x=>x.id===id);
	if(!it || it.resolved) return;
	it.chosen = action; it.resolved = true;
	const correct = action === it.correctAction;
	it.shownFeedback = correct ? it.feedback.correct : (it.feedback.wrong || it.feedback.correct);
	if(action==="open"){
		S.side = null;
		if(it.id.includes("PLACEHOLDER") || it.type==="PLACEHOLDER") S.page="closeout";
		else if(it.type==="PRESENTATION MIN") S.page="presmin";
		else S.page="assortment", S.tab="grid";
		render(); return;
	}
	if(S.mode==="challenge") fireHint(it.kind==="cancel"||it.kind==="md" ? "H-2" : "H-7", { postCommit:true });
	else if(it.kind==="md") fireHint("H-2");
	render();
}

/* ==================================================================
   READINESS CHECKS
   ================================================================== */
function readinessChecks(){
	const unflagged = S.styles.filter(styleNeedsFlag);
	const openErrors = S.styles.filter(r=>r.hasError && !r.errorExported);
	const unpopulated = S.placeholders.filter(p=>!placeholderPopulated(p));
	const pendingDeletes = S.styles.filter(r=>r.deleteIndicator && !r.deleteAccepted);
	return [
		{ id:"flags", title:"FLAGS CONFIRMED", pass: unflagged.length===0,
		  desc:"Every style color needing a Rebuy/Closeout decision has one.",
		  ev:[ unflagged.length===0 ? "✓ No unflagged style colors" : "✗ "+unflagged.length+" style color(s) still unflagged" ] },
		{ id:"errors", title:"ERRORS CLEARED", pass: openErrors.length===0,
		  desc:"Every Assortment Management Error has been exported to its owning partner.",
		  ev:[ openErrors.length===0 ? "✓ No open errors" : "✗ "+openErrors.length+" error(s) still open" ] },
		{ id:"placeholders", title:"PLACEHOLDERS POPULATED", pass: unpopulated.length===0,
		  desc:"Net Sales, AUR, AUC and Transfer In are entered for every Closeout Placeholder.",
		  ev:[ unpopulated.length===0 ? "✓ All placeholders populated" : "✗ "+unpopulated.length+" placeholder(s) still at the zero default" ] },
		{ id:"deletes", title:"LINE DELETES ACCEPTED", pass: pendingDeletes.length===0,
		  desc:"Every upstream Line Delete has been acknowledged.",
		  ev:[ pendingDeletes.length===0 ? "✓ No pending deletes" : "✗ "+pendingDeletes.length+" delete(s) not yet accepted" ] }
	];
}

/* ==================================================================
   CYCLE ROLLOVER — DESIGN: no numeric drift/consequence formula the way
   nvs-reforecast has one (the source gives none for Prep); unresolved
   items simply carry forward as still-open work into the next cycle.
   ================================================================== */
function closeCycle(){
	const score = computeScore();
	const checks = readinessChecks();
	S.cycleScores.push({ cycle:S.cycle, vals:score.vals, readiness:score.readiness,
	  checks: checks.map(c=>({ title:c.title, pass:c.pass })) });
	recordLedger();

	if(S.cycle < 2){
		const carryForward = clone(S.inbox.filter(i=>i.live && !i.resolved));
		carryForward.forEach(i=>{ i.carriedForward = true; });
		S.cycle += 1;
		S.inbox = clone(NVS_PREP_EXCEPTIONS[S.cycle]).concat(carryForward);
		S.screen = "close";
	} else {
		S.screen = "results";
	}
	renderScreen();
}
function recordLedger(){
	const unflagged = S.styles.filter(styleNeedsFlag).length;
	S.ledger.push({ id:"DEC-1", what:"Flag confirmations", out: unflagged===0 ? "Correct — no unflagged style colors" : "Missed — "+unflagged+" style color(s) left unflagged", ok: unflagged===0, consumer:"SSP Generate" });
	const openErrs = S.styles.filter(r=>r.hasError && !r.errorExported).length;
	S.ledger.push({ id:"DEC-2", what:"Error export discipline", out: openErrs===0 ? "Correct — no open errors" : "Missed — "+openErrs+" error(s) never exported", ok: openErrs===0, consumer:"Merch / AV" });
	const unpop = S.placeholders.filter(p=>!placeholderPopulated(p)).length;
	S.ledger.push({ id:"DEC-3", what:"Closeout Placeholder population", out: unpop===0 ? "Correct — all placeholders populated" : "Missed — "+unpop+" placeholder(s) left at zero", ok: unpop===0, consumer:"Code Submit" });
	const live = S.inbox.filter(i=>i.live);
	const routed = live.filter(i=>i.resolved && i.chosen===i.correctAction).length;
	S.ledger.push({ id:"DEC-4", what:"Guardrail routing", out: routed===live.length ? "Correct — every live item routed correctly" : "Partial — "+(live.length-routed)+" item(s) misrouted", ok: routed===live.length, consumer:"Merch / Line Plan" });
}

      ${esc(CYCLE_CFG[S.cycle].label)} · PRE-SUBMIT — you own readiness. Admin owns Code Submit. You never click the submit itself.</div>
    <div class="checks">`;
	checks.forEach(c=>{
		const st = c.pass ? ["PASS","chase-ink","chase-fill"] : ["INCOMPLETE","cancel-ink","cancel-fill"];
		h += `<div class="check" style="border-left-color:var(--${st[1]})">
      <div class="hd"><h3>${esc(c.title)}</h3>
        <span class="pill" style="color:var(--${st[1]});background:var(--${st[2]})">${st[0]}</span></div>
      <div class="desc">${esc(c.desc)}</div>
      <ul>${c.ev.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`;
	});
	h += `</div>
    <div style="display:flex;gap:12px;align-items:center;margin-top:18px">
      <button class="btn" id="rBack">Go back and finish a step</button>
      <button class="btn dark" id="rGo">Declare ready for ${esc(CYCLE_CFG[S.cycle].codeSubmit)}</button>
      <span style="font-size:10.5px;font-style:italic;color:var(--t-ink3);max-width:420px">
        Declaring ready with an incomplete check is permitted — and scored. Nothing here blocks you from submitting a plan you can't defend.</span>
    </div></div>`;
	d.innerHTML = h;
	d.querySelector("#rBack").onclick = backToWorkspace;
	d.querySelector("#rGo").onclick = ()=>{
		if(!confirm("Declare ready for "+CYCLE_CFG[S.cycle].codeSubmit+"?\n\nAdmin will execute Code Submit on what's currently in the plan. This cannot be undone.")) return;
		clearScreen(); closeCycle();
	};
}

function screenCycleClose(){
	const prev = S.cycle - 1;
	const d = screenEl("");
	const carried = S.inbox.filter(i=>i.carriedForward);
	let h = `<div class="dark" style="padding:36px 44px">
    <div style="font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--coach)">${esc(CYCLE_CFG[prev].label)} SUBMITTED</div>
    <h1 style="font-family:Georgia,serif;font-size:26px;margin:10px 0 12px">Admin has executed ${esc(CYCLE_CFG[prev].codeSubmit)}.</h1>
    <p style="max-width:760px;font-size:13px;color:#C9CDD2;line-height:1.65">
      Whatever wasn't resolved doesn't reset — it becomes ${esc(CYCLE_CFG[S.cycle].label)}'s opening problem.</p></div>
    <div class="wrapc"><div class="sec-hdr t">WHAT ${esc(CYCLE_CFG[S.cycle].label)} OPENS WITH</div>`;
	if(carried.length){
		carried.forEach(i=>{
			h += `<div class="evrow" style="border-left-color:var(--cancel-ink)"><div class="t">Carried forward: ${esc(i.title)}</div>
        <div class="s">Unresolved at ${esc(CYCLE_CFG[prev].label)} — still open now</div></div>`;
		});
	} else {
		h += `<div class="evrow" style="border-left-color:var(--chase-ink)"><div class="t">Clean handoff</div>
      <div class="s">Nothing carried forward from ${esc(CYCLE_CFG[prev].label)}</div></div>`;
	}
	h += `<div style="display:flex;gap:12px;margin-top:18px">
      <button class="btn dark" id="cGo">Begin ${esc(CYCLE_CFG[S.cycle].label)} ›</button></div></div>`;
	d.innerHTML = h;
	d.querySelector("#cGo").onclick = ()=>{
		S.screen = null; clearScreen();
		fireHint("H-9", { postCommit:true, force:true });
		render(); renderTrainerBar(); renderCoach();
	};
}

function screenResults(){
	const per = S.cycleScores;
	const avg = id => per.length ? per.reduce((s,p)=>s+p.vals[id],0)/per.length : 0;
	const readiness = per.length ? per.reduce((s,p)=>s+p.readiness,0)/per.length : 0;
	const tier = getScoreBadgeTier(readiness);
	/* Whichever tiers have an entry in TIER_MEDIA get celebration (or
	   consolation) media — tiers without one just show nothing. */
	const img = tierMediaHTML(TIER_MEDIA[tier.tier], tier.tier);
	const d = screenEl("");
	let h = `<div style="display:grid;grid-template-columns:340px 1fr;min-height:100vh">
    <div class="dark" style="padding:44px 34px">
      <div style="font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--coach)">RUN COMPLETE</div>
      <div style="font-size:15px;color:#C9CDD2;margin-top:10px">Prep Readiness</div>
      <div class="bignum">${Math.round(readiness)}%</div>
      <div style="font-size:11.5px;color:var(--t-ink3);margin-top:8px">${esc(S.mode)} mode · ${per.length} of 2 cycles submitted</div>
      ${img}
      <div class="tierbadge">TIER ${tier.tier} · ${esc(tier.label)}</div>
    </div>
    <div style="padding:36px 40px">
      <div class="sec-hdr t">OUTCOME-BASED KPIs — AVERAGED ACROSS BOTH CYCLES</div>
      <div style="margin-top:12px">`;
	KPI_OPTIONS.forEach(k=>{
		const v = avg(k.id);
		const ink = v>=90?"chase-ink":v>=80?"imp-ink":v>=60?"md-ink":"cancel-ink";
		h += `<div class="kpi" style="border-left-color:var(--${ink})">
      <div class="l"><div class="id">${esc(k.id)}</div><h3>${esc(k.name)}</h3><div class="d">${esc(k.desc)}</div></div>
      <div class="r"><div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%;background:var(--${ink})"></i></div>
        <div class="pc" style="color:var(--${ink})">${Math.round(v)}%</div>
        <div class="mm">${per.map(p=>"C"+p.cycle+" "+Math.round(p.vals[k.id])+"%").join("  ")}</div></div></div>`;
	});
	h += `</div><div class="sec-hdr t" style="margin-top:18px">DECISION LEDGER</div><div style="margin-top:12px">`;
	S.ledger.forEach(l=>{
		const ink = l.ok ? "chase-ink" : (String(l.out).startsWith("Partial") ? "md-ink" : "cancel-ink");
		h += `<div class="ledger" style="border-left-color:var(--${ink})">
      <div class="id">${esc(l.id)}</div><div class="w">${esc(l.what)}<br>
      <span style="color:var(--t-ink3);font-size:9.5px">downstream: ${esc(l.consumer)}</span></div>
      <div class="o" style="color:var(--${ink})">${esc(l.out)}</div></div>`;
	});
	h += `<button class="btn dark" id="resGo" style="margin-top:20px">Continue to reflection ›</button></div></div></div>`;
	d.innerHTML = h;
	d.querySelector("#resGo").onclick = ()=>{ S.screen="reflect"; renderScreen(); };
}

function screenReflection(){
	const d = screenEl("dark");
	d.innerHTML = `<div class="wrapc">
    <div class="kicker"></div>
    <h1 style="font-family:Georgia,serif;font-size:32px;margin:14px 0 18px">The plan is only as clean as its inputs.</h1>
    <p style="font-size:14px;color:#C9CDD2;line-height:1.7;max-width:900px">
      Nothing you did here planned a single sale. That's the point — Prep isn't about shaping demand, it's about making sure the SSP has something trustworthy to generate from.</p>
    <div class="principles">
      <div class="principle"><div class="top"></div><div class="n">01</div>
        <h3>The flag decides everything downstream</h3>
        <p>Rebuy or Closeout isn't a label — it's the difference between the system generating receipts and constraining demand to what's already in the channel.</p></div>
      <div class="principle"><div class="top"></div><div class="n">02</div>
        <h3>Errors are fixed upstream, never in o9</h3>
        <p>Assortment Management Error is a quarantine, not a workbench. Your leverage is exporting the evidence to the partner who owns the source data.</p></div>
      <div class="principle"><div class="top"></div><div class="n">03</div>
        <h3>A default of zero is not neutral</h3>
        <p>Closeout Placeholders don't get an analytics forecast. Leaving one at zero doesn't skip a decision — it makes one, quietly, against the whole channel.</p></div>
    </div>
    <div style="background:var(--coach);color:#fff;font-size:14px;font-weight:700;padding:16px 20px;max-width:1000px">
      What you clean in Prep is what the SSP builds from. Errors don't stay with you — they travel downstream.</div>
    <button class="btn" style="margin-top:26px;background:#fff;color:var(--t-ink);font-weight:700" id="again">Run it again</button>
  </div>`;
	d.querySelector("#again").onclick = ()=>{
		if(!confirm("Run it again?\n\nThis clears both cycles and returns you to the Launch Screen. This cannot be undone.")) return;
		S=null; document.getElementById("app").classList.add("hidden");
		const c=document.getElementById("coach"); if(c) c.classList.add("hidden");
		const t=document.getElementById("tbar"); if(t) t.classList.add("hidden");
		renderLaunch();
	};
}

/* ==================================================================
   INIT
   ================================================================== */
document.addEventListener("DOMContentLoaded", renderLaunch);

</script>
</body>
</html>
